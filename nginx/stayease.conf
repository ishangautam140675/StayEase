# ==============================================================================
# StayEase Production Nginx Reverse Proxy Configuration
# SSL Termination, Proxy Headers, Rate Limiting, Compression & Security Headers
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=stayease_auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=stayease_general_limit:10m rate=50r/s;

# Upstream Backend Pool
upstream stayease_backend {
    server app:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name stayease.example.com www.stayease.example.com;

    # Allow ACME challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Primary Virtual Host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stayease.example.com www.stayease.example.com;

    # SSL Certificates (mount from /etc/letsencrypt or custom certs)
    ssl_certificate /etc/nginx/ssl/live/stayease.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/stayease.example.com/privkey.pem;

    # Modern TLS Security Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers (Defense-in-depth with Spring Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Root Request Proxying
    location / {
        limit_req zone=stayease_general_limit burst=20 nodelay;

        proxy_pass http://stayease_backend;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        # Buffering & Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }

    # Strict Rate Limiting on Authentication & Password Endpoints
    location ~* ^/(login|register|forgot-password|reset-password)$ {
        limit_req zone=stayease_auth_limit burst=5 nodelay;

        proxy_pass http://stayease_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
    }

    # Internal Health Checks (Pass through directly for monitoring)
    location /actuator/health {
        proxy_pass http://stayease_backend/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Restrict other Actuator endpoints from public internet
    location /actuator {
        # Allow internal network only
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        proxy_pass http://stayease_backend;
        proxy_set_header Host $host;
    }

    # Deny access to hidden dotfiles (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
