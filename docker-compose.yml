version: '3.8'

# ==============================================================================
# StayEase Production Multi-Container Composition
# Services: MySQL 8 Database, StayEase Application, Nginx Reverse Proxy
# ==============================================================================

services:
  # ── Database Service ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: stayease_db
    restart: always
    environment:
      MYSQL_DATABASE: stayease
      MYSQL_USER: ${DB_USERNAME:-stayease_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_pwd_123}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=150
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=128M
      --sql_mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    volumes:
      - db_data:/var/lib/mysql
      - ./scripts/schema-prod.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - stayease_backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── StayEase Application Service ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stayease_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/stayease?createDatabaseIfNotExist=false&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-stayease_user}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@stayease.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_BASE_URL: ${APP_BASE_URL:-https://stayease.example.com}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.example.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    networks:
      - stayease_backend
      - stayease_frontend
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Nginx Reverse Proxy Service ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: stayease_proxy
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/stayease.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/nginx/ssl
      - certbot_webroot:/var/www/certbot
    networks:
      - stayease_frontend

networks:
  stayease_backend:
    driver: bridge
    internal: true
  stayease_frontend:
    driver: bridge

volumes:
  db_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_webroot:
    driver: local
