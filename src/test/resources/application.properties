# Test-specific properties — override the main application.properties for tests.
# These are loaded automatically by Spring Boot Test from src/test/resources.

# ── DataSource: H2 in-memory (replaces MySQL during tests) ──────────────────
# MODE=MySQL makes H2 behave like MySQL (same SQL dialect, AUTO_INCREMENT, etc.)
# DB_CLOSE_DELAY=-1 keeps the DB alive as long as the JVM is running.
spring.datasource.url=jdbc:h2:mem:stayease;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# "create-drop" builds the schema before each test run and drops it afterwards.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Suppress the open-in-view warning (disabled explicitly as in main config).
spring.jpa.open-in-view=false
# Silence SQL output during tests to keep logs clean.
spring.jpa.show-sql=false

# ── Thymeleaf ───────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

app.booking.cancellation-lead-hours=24
app.mail.enabled=false
app.mail.from=test@stayease.com
app.base-url=http://localhost:8080


