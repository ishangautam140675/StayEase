<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Room ' + ${room.roomNumber})}"></head>

<body class="d-flex flex-column min-vh-100" style="background: var(--surface-page);">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<main class="flex-grow-1 py-5">
    <div class="container se-container">

        <!-- Breadcrumb / Back Link -->
        <div class="mb-4">
            <a th:href="@{/rooms}" class="text-decoration-none small fw-medium" style="color: var(--brand-cobalt);">
                <i class="bi bi-arrow-left me-1"></i>Back to all rooms
            </a>
        </div>

        <div class="row g-4 justify-content-center">
            <div class="col-12 col-lg-8">

                <!-- Room Detail Card -->
                <div class="card border-0 shadow-sm p-4 p-md-5" style="background: var(--surface-card); border-radius: 16px;">

                    <!-- Header -->
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4 pb-3 border-bottom"
                         style="border-color: var(--border-default) !important;">
                        <div>
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <span class="badge px-3 py-1 rounded-pill"
                                      style="background: var(--brand-cobalt-soft); color: var(--brand-cobalt); font-size: 0.85rem;"
                                      th:text="${room.type}">SINGLE</span>
                                <span class="badge px-3 py-1 rounded-pill"
                                      th:if="${room.active}"
                                      style="background: #E5F2E8; color: #21633E; font-size: 0.85rem;">Available</span>
                            </div>
                            <h1 class="display-6 fw-bold mb-0" style="color: var(--text-primary); font-family: 'DM Sans', sans-serif;">
                                Room <span th:text="${room.roomNumber}">101</span>
                            </h1>
                        </div>

                        <!-- Price Tag -->
                        <div class="text-md-end">
                            <span class="small text-secondary">Price per night</span>
                            <div class="display-6 fw-bold" style="color: var(--brand-oxblood);">
                                ₹<span th:text="${#numbers.formatDecimal(room.pricePerNight, 1, 2)}">750.00</span>
                            </div>
                        </div>
                    </div>

                    <!-- Room Specifications -->
                    <div class="row g-3 my-3">
                        <div class="col-6 col-md-4">
                            <div class="p-3 rounded" style="background: var(--surface-page);">
                                <span class="small text-secondary d-block">Room Number</span>
                                <span class="fw-bold" style="color: var(--text-primary);" th:text="${room.roomNumber}">101</span>
                            </div>
                        </div>
                        <div class="col-6 col-md-4">
                            <div class="p-3 rounded" style="background: var(--surface-page);">
                                <span class="small text-secondary d-block">Accommodates</span>
                                <span class="fw-bold" style="color: var(--text-primary);">
                                    <span th:text="${room.capacity}">1</span> Guests
                                </span>
                            </div>
                        </div>
                        <div class="col-6 col-md-4">
                            <div class="p-3 rounded" style="background: var(--surface-page);">
                                <span class="small text-secondary d-block">Category</span>
                                <span class="fw-bold" style="color: var(--text-primary);" th:text="${room.type}">SINGLE</span>
                            </div>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="my-4">
                        <h2 class="h5 fw-bold mb-3" style="color: var(--text-primary);">Room Description</h2>
                        <p class="text-secondary" style="line-height: 1.7;"
                           th:text="${room.description != null ? room.description : 'A thoughtfully designed accommodation providing high-speed internet, premium bedding, and a peaceful environment for studying and relaxation.'}">
                            Description text here...
                        </p>
                    </div>

                    <!-- Actions depending on User Identity -->
                    <div class="pt-4 border-top mt-4" style="border-color: var(--border-default) !important;">

                        <!-- CUSTOMER sees "Request booking" button -->
                        <div sec:authorize="hasRole('CUSTOMER')">
                            <a th:href="@{/customer/bookings/new(roomId=${room.id})}"
                               class="btn btn-cobalt btn-lg px-4 fw-semibold">
                                <i class="bi bi-calendar-check me-2"></i>Request booking
                            </a>
                        </div>

                        <!-- Anonymous visitor sees "Log in to book" button -->
                        <div sec:authorize="isAnonymous()">
                            <a th:href="@{/login}"
                               class="btn btn-outline-se btn-lg px-4 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Log in to book
                            </a>
                        </div>

                        <!-- ADMIN sees neither button -->
                        <div sec:authorize="hasRole('ADMIN')" class="text-muted small fst-italic">
                            <i class="bi bi-info-circle me-1"></i>Logged in as Administrator (booking requests are made from customer accounts).
                        </div>

                    </div>

                </div>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
