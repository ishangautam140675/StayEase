<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Edit Room' : 'Add Room')}"></head>

<body class="d-flex flex-column min-vh-100" style="background: var(--surface-page);">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<main class="flex-grow-1 py-5">
    <div class="container se-container">

        <!-- Back Link -->
        <div class="mb-4">
            <a th:href="@{/admin/rooms}" class="text-decoration-none small fw-medium" style="color: var(--brand-cobalt);">
                <i class="bi bi-arrow-left me-1"></i>Back to room list
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- Card -->
                <div class="card border-0 shadow-sm p-4 p-md-5" style="background: var(--surface-card); border-radius: 14px;">

                    <!-- Header -->
                    <div class="mb-4 pb-3 border-bottom" style="border-color: var(--border-default) !important;">
                        <span class="text-uppercase fw-bold small tracking-wider" style="color: var(--brand-oxblood); letter-spacing: 0.1em;">
                            Room Configuration
                        </span>
                        <h1 class="h3 fw-bold mt-1 mb-1" style="color: var(--text-primary); font-family: 'DM Sans', sans-serif;"
                            th:text="${isEdit} ? 'Edit Room ' + ${roomForm.roomNumber} : 'Create New Room'">
                            Room Form
                        </h1>
                        <p class="text-secondary small mb-0">Fill in the accommodation details below.</p>
                    </div>

                    <!-- Room Form -->
                    <form th:action="${isEdit} ? @{/admin/rooms/{id}(id=${roomId})} : @{/admin/rooms}"
                          th:object="${roomForm}"
                          method="post"
                          novalidate>

                        <!-- CSRF Token -->
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- Room Number -->
                        <div class="mb-3">
                            <label for="roomNumber" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                Room Number <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   id="roomNumber"
                                   th:field="*{roomNumber}"
                                   th:classappend="${#fields.hasErrors('roomNumber')} ? 'is-invalid'"
                                   class="form-control"
                                   placeholder="e.g. 101, 204A"
                                   maxlength="10"
                                   required/>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('roomNumber')}">
                                <span th:errors="*{roomNumber}"></span>
                            </div>
                        </div>

                        <!-- Room Type -->
                        <div class="mb-3">
                            <label for="type" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                Room Type <span class="text-danger">*</span>
                            </label>
                            <select id="type"
                                    th:field="*{type}"
                                    th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'"
                                    class="form-select"
                                    required>
                                <option value="" disabled selected>Select category...</option>
                                <option th:each="t : ${roomTypes}"
                                        th:value="${t}"
                                        th:text="${t}"></option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('type')}">
                                <span th:errors="*{type}"></span>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <!-- Capacity -->
                            <div class="col-12 col-sm-6">
                                <label for="capacity" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                    Capacity (Guests) <span class="text-danger">*</span>
                                </label>
                                <input type="number"
                                       id="capacity"
                                       th:field="*{capacity}"
                                       th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid'"
                                       class="form-control"
                                       min="1"
                                       max="10"
                                       required/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('capacity')}">
                                    <span th:errors="*{capacity}"></span>
                                </div>
                            </div>

                            <!-- Price per Night -->
                            <div class="col-12 col-sm-6">
                                <label for="pricePerNight" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                    Price per Night (₹) <span class="text-danger">*</span>
                                </label>
                                <input type="number"
                                       step="0.01"
                                       id="pricePerNight"
                                       th:field="*{pricePerNight}"
                                       th:classappend="${#fields.hasErrors('pricePerNight')} ? 'is-invalid'"
                                       class="form-control"
                                       min="1.00"
                                       placeholder="750.00"
                                       required/>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('pricePerNight')}">
                                    <span th:errors="*{pricePerNight}"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                Description <span class="text-secondary fw-normal">(optional, max 1000 characters)</span>
                            </label>
                            <textarea id="description"
                                      th:field="*{description}"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Provide amenities, furnishing, or view details..."></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('description')}">
                                <span th:errors="*{description}"></span>
                            </div>
                        </div>

                        <!-- Amenities -->
                        <div class="mb-4">
                            <label for="amenities" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                Amenities <span class="text-secondary fw-normal">(comma-separated, e.g. Wi-Fi, AC, Balcony, Workspace)</span>
                            </label>
                            <input type="text"
                                   id="amenities"
                                   th:field="*{amenities}"
                                   th:classappend="${#fields.hasErrors('amenities')} ? 'is-invalid'"
                                   class="form-control"
                                   placeholder="Wi-Fi, Air Conditioning, Balcony, Dedicated Desk"
                                   maxlength="500"/>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('amenities')}">
                                <span th:errors="*{amenities}"></span>
                            </div>
                        </div>

                        <!-- ── Phase 11: Real-World Property & Location Details ──────────────── -->
                        <div class="p-3 mb-4 rounded-3 border" style="background: var(--surface-secondary, #f8fafc); border-color: var(--border-default) !important;">
                            <div class="d-flex align-items-center mb-3">
                                <i class="bi bi-geo-alt-fill text-danger me-2 fs-5"></i>
                                <div>
                                    <h6 class="mb-0 fw-bold" style="color: var(--text-primary);">Property & Location Intelligence</h6>
                                    <small class="text-secondary">Specify real-world accommodation details, GPS coordinates, and verification status.</small>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <!-- Property Name -->
                                <div class="col-12 col-md-7">
                                    <label for="propertyName" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                        Property / Hostel / PG Name
                                    </label>
                                    <input type="text"
                                           id="propertyName"
                                           th:field="*{propertyName}"
                                           class="form-control"
                                           placeholder="e.g. Greenview Student Hostel, Stayease Luxury PG"
                                           maxlength="150"/>
                                </div>

                                <!-- Accommodation Type -->
                                <div class="col-12 col-md-5">
                                    <label for="accommodationType" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                        Accommodation Type
                                    </label>
                                    <select id="accommodationType"
                                            th:field="*{accommodationType}"
                                            class="form-select">
                                        <option th:each="at : ${accommodationTypes}"
                                                th:value="${at}"
                                                th:text="${at.displayName}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <!-- Monthly Rent -->
                                <div class="col-12 col-md-6">
                                    <label for="monthlyRent" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                        Monthly Rent (₹) <span class="text-secondary fw-normal">(Optional for long-term / PG)</span>
                                    </label>
                                    <input type="number"
                                           step="0.01"
                                           id="monthlyRent"
                                           th:field="*{monthlyRent}"
                                           class="form-control"
                                           placeholder="e.g. 8500.00"/>
                                </div>

                                <!-- Photo URL -->
                                <div class="col-12 col-md-6">
                                    <label for="photoUrl" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                        Custom Photo URL
                                    </label>
                                    <input type="text"
                                           id="photoUrl"
                                           th:field="*{photoUrl}"
                                           class="form-control"
                                           placeholder="https://images.unsplash.com/... or /images/..."
                                           maxlength="500"/>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <!-- Full Address -->
                                <div class="col-12 col-md-6">
                                    <label for="address" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                        Full Address / Street
                                    </label>
                                    <input type="text"
                                           id="address"
                                           th:field="*{address}"
                                           class="form-control"
                                           placeholder="e.g. #42, 5th Main Road, Near Jyoti Nivas College"
                                           maxlength="255"/>
                                </div>

                                <!-- Locality -->
                                <div class="col-12 col-md-3">
                                    <label for="locality" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                        Locality / Area
                                    </label>
                                    <input type="text"
                                           id="locality"
                                           th:field="*{locality}"
                                           class="form-control"
                                           placeholder="e.g. Koramangala"
                                           maxlength="100"/>
                                </div>

                                <!-- City -->
                                <div class="col-12 col-md-3">
                                    <label for="city" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                        City
                                    </label>
                                    <input type="text"
                                           id="city"
                                           th:field="*{city}"
                                           class="form-control"
                                           placeholder="e.g. Bengaluru"
                                           maxlength="100"/>
                                </div>
                            </div>

                            <div class="row g-3 mb-2">
                                <!-- Postal Code -->
                                <div class="col-12 col-md-4">
                                    <label for="postalCode" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                        Postal Code / PIN
                                    </label>
                                    <input type="text"
                                           id="postalCode"
                                           th:field="*{postalCode}"
                                           class="form-control"
                                           placeholder="e.g. 560034"
                                           maxlength="20"/>
                                </div>

                                <!-- Latitude -->
                                <div class="col-12 col-md-4">
                                    <label for="latitude" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                        Latitude (GPS)
                                    </label>
                                    <input type="number"
                                           step="any"
                                           id="latitude"
                                           th:field="*{latitude}"
                                           class="form-control"
                                           placeholder="e.g. 12.9352"/>
                                </div>

                                <!-- Longitude -->
                                <div class="col-12 col-md-4">
                                    <label for="longitude" class="form-label small fw-semibold" style="color: var(--text-primary);">
                                        Longitude (GPS)
                                    </label>
                                    <input type="number"
                                           step="any"
                                           id="longitude"
                                           th:field="*{longitude}"
                                           class="form-control"
                                           placeholder="e.g. 77.6245"/>
                                </div>
                            </div>

                            <!-- Verified Listing Checkbox -->
                            <div class="form-check form-switch mt-3">
                                <input class="form-check-input"
                                       type="checkbox"
                                       role="switch"
                                       id="verified"
                                       th:field="*{verified}"/>
                                <label class="form-check-label fw-semibold small text-success" for="verified">
                                    <i class="bi bi-patch-check-fill me-1"></i>Verified StayEase Listing (Physical property inspected & verified)
                                </label>
                            </div>
                        </div>

                        <!-- Active Toggle -->
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input"
                                   type="checkbox"
                                   role="switch"
                                   id="active"
                                   th:field="*{active}"/>
                            <label class="form-check-label fw-medium small" for="active" style="color: var(--text-primary);">
                                Active (available in public accommodation catalog)
                            </label>
                        </div>

                        <!-- Under Maintenance Toggle (Phase 3) -->
                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input"
                                   type="checkbox"
                                   role="switch"
                                   id="underMaintenance"
                                   th:field="*{underMaintenance}"/>
                            <label class="form-check-label fw-medium small text-warning-emphasis" for="underMaintenance">
                                <i class="bi bi-tools me-1 text-warning"></i>Under Maintenance (blocked from guest booking and availability searches)
                            </label>
                        </div>

                        <!-- Form Actions -->
                        <div class="d-flex gap-2 justify-content-end pt-3 border-top" style="border-color: var(--border-default) !important;">
                            <a th:href="@{/admin/rooms}" class="btn btn-outline-secondary px-4">Cancel</a>
                            <button type="submit" class="btn btn-cobalt px-4 fw-semibold">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="${isEdit} ? 'Save Changes' : 'Create Room'">Save</span>
                            </button>
                        </div>

                    </form>

                </div>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
