<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>

<body class="d-flex flex-column min-vh-100" style="background: var(--surface-page);">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<main class="flex-grow-1 py-5">
    <div class="container se-container">
        <div class="card border-0 shadow-sm p-4 p-md-5" style="background: var(--surface-card);">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
                <div class="d-flex align-items-center gap-3">
                    <span class="d-inline-flex align-items-center justify-content-center rounded-circle"
                          style="width:52px;height:52px;background:var(--brand-oxblood-soft);">
                        <i class="bi bi-shield-lock-fill fs-4" style="color:var(--brand-oxblood);"></i>
                    </span>
                    <div>
                        <h1 class="h3 fw-bold mb-1" style="color:var(--text-primary);">Admin dashboard</h1>
                        <p class="mb-0" style="color:var(--text-secondary);">
                            Welcome, <span class="fw-semibold" style="color:var(--text-primary);" th:text="${userName}">Admin</span>!
                        </p>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline-danger btn-sm px-3">
                        <i class="bi bi-box-arrow-right me-1"></i>Sign out
                    </button>
                </form>
            </div>
            <p class="text-secondary small mb-0">
                Placeholder page for Phase 5. Full administrative rooms and bookings features will be available in Phase 13.
            </p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
