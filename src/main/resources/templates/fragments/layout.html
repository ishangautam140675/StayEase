<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ── Fragment: head(title) ────────────────────────────────────────────── -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'StayEase | ' + ${title}">StayEase</title>

    <!-- Bootstrap 5 CSS from CDN -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <!-- Application-specific styles -->
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>

<body>

<!-- ── Fragment: navbar ────────────────────────────────────────────────── -->
<th:block th:fragment="navbar">
    <!-- Dark navbar for ADMIN -->
    <nav sec:authorize="hasRole('ADMIN')" class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom py-3" style="background-color: #1a1014 !important; border-bottom: 2px solid #3d1b26 !important;">
        <div class="container se-container">
            <!-- Brand with Admin label -->
            <a class="navbar-brand text-white fw-bold d-inline-flex align-items-center" th:href="@{/}">
                <i class="bi bi-building-fill me-2" style="color: var(--brand-tangerine);"></i>
                <span>StayEase</span>
                <span class="badge ms-2 px-2 py-1 text-uppercase fw-bold" style="background-color: var(--brand-tangerine); color: #FFFFFF; font-size: 0.65rem; letter-spacing: 0.08em; vertical-align: middle;">Admin</span>
            </a>

            <!-- Mobile Toggler -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#adminNavbar" aria-controls="adminNavbar"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Collapsible Content -->
            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link text-white-50" th:href="@{/rooms}">Rooms</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/admin/dashboard}">Admin dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/admin/rooms}">Manage rooms</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/admin/bookings}">Manage bookings</a>
                    </li>
                </ul>

                <div class="d-flex align-items-lg-center gap-2 mt-3 mt-lg-0">
                    <form th:action="@{/logout}" method="post" class="d-inline m-0">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-light btn-sm px-3">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <!-- Primary-colored navbar for others (CUSTOMER & Anonymous) -->
    <nav sec:authorize="!hasRole('ADMIN')" class="navbar navbar-expand-lg navbar-dark border-bottom py-3" style="background-color: var(--brand-cobalt) !important; border-bottom: 2px solid #2335aa !important;">
        <div class="container se-container">
            <!-- Brand -->
            <a class="navbar-brand text-white fw-bold d-inline-flex align-items-center" th:href="@{/}">
                <i class="bi bi-building-fill me-2" style="color: #FFF8ED;"></i>
                <span>StayEase</span>
            </a>

            <!-- Mobile Toggler -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Collapsible Content -->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/rooms}">Rooms</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                        <a class="nav-link text-white" th:href="@{/customer/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                        <a class="nav-link text-white" th:href="@{/customer/bookings}">My bookings</a>
                    </li>
                </ul>

                <div class="d-flex align-items-lg-center gap-2 mt-3 mt-lg-0">
                    <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
                        <a class="btn btn-outline-light btn-sm px-3" th:href="@{/login}">Login</a>
                        <a class="btn btn-light btn-sm px-3 fw-medium" style="color: var(--brand-cobalt);" th:href="@{/register}">Register</a>
                    </div>
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                        <form th:action="@{/logout}" method="post" class="d-inline m-0">
                            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-light btn-sm px-3">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</th:block>

<!-- ── Fragment: flash ─────────────────────────────────────────────────── -->
<div th:fragment="flash" class="container se-container my-3">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Operation successful!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">An error occurred.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- ── Fragment: footer ────────────────────────────────────────────────── -->
<footer th:fragment="footer" class="se-footer mt-auto py-4">
    <div class="container se-container">
        <div class="row g-3 align-items-center">
            <div class="col-md-6 text-center text-md-start">
                <span class="se-footer-brand d-inline-flex align-items-center gap-2 mb-1">
                    <i class="bi bi-building"></i> StayEase
                </span>
                <p class="small text-secondary mb-0" style="color: #E6D9DC !important;">
                    Hostel &amp; PG Booking System &mdash; Editorial Hospitality.
                </p>
            </div>
            <div class="col-md-6 text-center text-md-end">
                <p class="small text-secondary mb-0" style="color: #E6D9DC !important;">
                    &copy; 2026 StayEase. All rights reserved.
                </p>
            </div>
        </div>
    </div>
</footer>

<!-- ── Fragment: scripts ───────────────────────────────────────────────── -->
<div th:fragment="scripts">
    <!-- Bootstrap 5 JS bundle from CDN (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmBA16Syvr9sKxHHp8kJPY7oixDH"
            crossorigin="anonymous"></script>

    <!-- Prevent double submission on all forms -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('form').forEach(function(form) {
                form.addEventListener('submit', function(e) {
                    if (e.defaultPrevented) return;
                    if (form.checkValidity && !form.checkValidity()) return;
                    const submitBtn = form.querySelector('button[type="submit"]');
                    if (submitBtn) {
                        setTimeout(function() {
                            submitBtn.disabled = true;
                        }, 0);
                    }
                });
            });
        });
    </script>
</div>

</body>
</html>
