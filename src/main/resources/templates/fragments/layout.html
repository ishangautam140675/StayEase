<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ── Fragment: head(title) ────────────────────────────────────────────── -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'StayEase | ' + ${title}">StayEase</title>

    <!-- Bootstrap 5 CSS from CDN -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <!-- Application-specific styles -->
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>

<body>

<!-- ── Fragment: navbar ────────────────────────────────────────────────── -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg se-header border-bottom py-3">
    <div class="container se-container">
        <!-- Brand -->
        <a class="navbar-brand se-brand" th:href="@{/}">
            <i class="bi bi-building-fill me-1" style="color: var(--brand-oxblood);"></i>StayEase
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible Content -->
        <div class="collapse navbar-collapse" id="mainNavbar">
            <!-- Navigation Links -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link se-nav-link" th:href="@{/rooms}">Rooms</a>
                </li>

                <!-- ROLE_CUSTOMER Links -->
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link se-nav-link" th:href="@{/customer/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link se-nav-link" th:href="@{/customer/bookings}">My bookings</a>
                </li>

                <!-- ROLE_ADMIN Links -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link se-nav-link" th:href="@{/admin/dashboard}">Admin dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link se-nav-link" th:href="@{/admin/rooms}">Manage rooms</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link se-nav-link" th:href="@{/admin/bookings}">Manage bookings</a>
                </li>
            </ul>

            <!-- Right Actions (Auth Dependent) -->
            <div class="d-flex align-items-lg-center gap-2 mt-3 mt-lg-0">
                <!-- Anonymous: Login and Register -->
                <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
                    <a class="btn btn-outline-se btn-sm px-3" th:href="@{/login}">Login</a>
                    <a class="btn btn-cobalt btn-sm px-3" th:href="@{/register}">Register</a>
                </div>

                <!-- Authenticated: Logout POST form with CSRF -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <form th:action="@{/logout}" method="post" class="d-inline m-0">
                        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-se btn-sm px-3">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- ── Fragment: flash ─────────────────────────────────────────────────── -->
<div th:fragment="flash" class="container se-container my-3">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Operation successful!</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">An error occurred.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<!-- ── Fragment: footer ────────────────────────────────────────────────── -->
<footer th:fragment="footer" class="se-footer mt-auto py-4">
    <div class="container se-container">
        <div class="row g-3 align-items-center">
            <div class="col-md-6 text-center text-md-start">
                <span class="se-footer-brand d-inline-flex align-items-center gap-2 mb-1">
                    <i class="bi bi-building"></i> StayEase
                </span>
                <p class="small text-secondary mb-0" style="color: #E6D9DC !important;">
                    Hostel &amp; PG Booking System &mdash; Editorial Hospitality.
                </p>
            </div>
            <div class="col-md-6 text-center text-md-end">
                <p class="small text-secondary mb-0" style="color: #E6D9DC !important;">
                    &copy; 2026 StayEase. All rights reserved.
                </p>
            </div>
        </div>
    </div>
</footer>

<!-- ── Fragment: scripts ───────────────────────────────────────────────── -->
<div th:fragment="scripts">
    <!-- Bootstrap 5 JS bundle from CDN (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmBA16Syvr9sKxHHp8kJPY7oixDH"
            crossorigin="anonymous"></script>
</div>

</body>
</html>
