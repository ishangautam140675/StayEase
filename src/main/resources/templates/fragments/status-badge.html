<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Reusable Booking Status Badge Fragment -->
<th:block th:fragment="badge(status)" th:if="${status != null}">
    <span th:if="${status.name() == 'PENDING' or status == 'PENDING'}"
          class="se-badge se-badge-pending">
        <i class="bi bi-hourglass-split me-1"></i>PENDING
    </span>
    <span th:if="${status.name() == 'APPROVED' or status == 'APPROVED'}"
          class="se-badge se-badge-approved">
        <i class="bi bi-check-circle-fill me-1"></i>APPROVED
    </span>
    <span th:if="${status.name() == 'CHECKED_IN' or status == 'CHECKED_IN'}"
          class="se-badge se-badge-checked-in">
        <i class="bi bi-box-arrow-in-right me-1"></i>CHECKED IN
    </span>
    <span th:if="${status.name() == 'CHECKED_OUT' or status == 'CHECKED_OUT'}"
          class="se-badge se-badge-checked-out">
        <i class="bi bi-box-arrow-right me-1"></i>CHECKED OUT
    </span>
    <span th:if="${status.name() == 'NO_SHOW' or status == 'NO_SHOW'}"
          class="se-badge se-badge-no-show">
        <i class="bi bi-person-x me-1"></i>NO SHOW
    </span>
    <span th:if="${status.name() == 'REJECTED' or status == 'REJECTED'}"
          class="se-badge se-badge-rejected">
        <i class="bi bi-x-circle-fill me-1"></i>REJECTED
    </span>
    <span th:if="${status.name() == 'CANCELLED' or status == 'CANCELLED'}"
          class="se-badge se-badge-cancelled">
        <i class="bi bi-slash-circle me-1"></i>CANCELLED
    </span>
</th:block>

</body>
</html>
