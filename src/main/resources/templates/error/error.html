<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notice')}">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>StayEase | Notice</title>
</head>
<body>

<!-- Navbar Fragment -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<!-- Flash Messages Fragment -->
<div th:replace="~{fragments/layout :: flash}"></div>

<!-- Generic Error Content -->
<main class="page-content d-flex align-items-center py-5">
    <div class="container se-container">
        <div class="error-page-container bg-white p-5 rounded-4 border shadow-sm mx-auto text-center" style="max-width: 600px;">
            <div class="mb-4">
                <i class="bi bi-shield-exclamation text-warning" style="font-size: 3.5rem;"></i>
            </div>
            <h2 class="h3 fw-bold text-dark mb-3">Notice</h2>
            <p class="text-secondary mb-4">
                We encountered an unexpected condition while processing your request. For your security, sensitive operational details are not displayed.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a th:href="@{/}" class="btn btn-cobalt">
                    <i class="bi bi-house-door me-2"></i>Back to Home
                </a>
                <a th:href="@{/rooms}" class="btn btn-outline-se">
                    <i class="bi bi-compass me-2"></i>Browse Rooms
                </a>
            </div>
        </div>
    </div>
</main>

<!-- Footer Fragment -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- Scripts Fragment -->
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
