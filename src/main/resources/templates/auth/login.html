<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Sign In')}"></head>

<body class="d-flex flex-column min-vh-100" style="background: var(--surface-page);">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container se-container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

                <!-- Card -->
                <div class="card border-0 shadow-sm" style="background: var(--surface-card); border-radius: var(--radius-card); border: 1px solid var(--border-default) !important;">
                    <div class="card-body p-4 p-md-5">

                        <!-- Header -->
                        <div class="text-center mb-4">
                            <span class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                                  style="width:52px;height:52px;background:var(--brand-cobalt-soft);">
                                <i class="bi bi-box-arrow-in-right fs-4" style="color:var(--brand-cobalt);"></i>
                            </span>
                            <h1 class="h4 fw-bold mb-1" style="color:var(--text-primary);">Welcome back</h1>
                            <p class="small" style="color:var(--text-secondary);">
                                Don't have an account?
                                <a th:href="@{/register}" style="color:var(--brand-cobalt);">Sign up</a>
                            </p>
                        </div>

                        <!-- Alerts -->
                        <!-- Error Alert -->
                        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center small py-2 px-3 mb-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2 fs-6"></i>
                            <div>Invalid email or password</div>
                        </div>

                        <!-- Logout Alert -->
                        <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center small py-2 px-3 mb-3" role="alert">
                            <i class="bi bi-info-circle-fill me-2 fs-6"></i>
                            <div>You have been logged out.</div>
                        </div>

                        <!-- Registered Alert -->
                        <div th:if="${param.registered}" class="alert alert-success d-flex align-items-center small py-2 px-3 mb-3" role="alert">
                            <i class="bi bi-check-circle-fill me-2 fs-6"></i>
                            <div th:text="${successMessage != null ? successMessage : 'Account created. Please log in.'}">Account created. Please log in.</div>
                        </div>

                        <!-- Login Form -->
                        <form th:action="@{/login}" method="post">

                            <!-- CSRF token -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-medium small"
                                       style="color:var(--text-primary);">Email address</label>
                                <input type="email"
                                       id="email"
                                       name="email"
                                       class="form-control"
                                       placeholder="you@example.com"
                                       required
                                       autofocus
                                       autocomplete="email"/>
                            </div>

                            <!-- Password -->
                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label fw-medium small mb-0"
                                           style="color:var(--text-primary);">Password</label>
                                    <a th:href="@{/forgot-password}" class="small text-decoration-none fw-medium"
                                       style="color:var(--brand-cobalt);">Forgot password?</a>
                                </div>
                                <input type="password"
                                       id="password"
                                       name="password"
                                       class="form-control"
                                       placeholder="••••••••"
                                       required
                                       autocomplete="current-password"/>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-cobalt btn-lg fw-semibold">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign in
                                </button>
                            </div>

                        </form>

                        <!-- Divider & registration link -->
                        <hr class="my-4" style="border-color:var(--border-default);">
                        <p class="text-center small mb-3" style="color:var(--text-secondary);">
                            New to StayEase?
                            <a th:href="@{/register}" class="fw-medium" style="color:var(--brand-cobalt);">Create an account</a>
                        </p>

                        <!-- Demo Accounts Quick Fill -->
                        <div class="pt-3 border-top" style="border-color: var(--border-default) !important;">
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <span class="small fw-bold text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.06em; color: var(--text-secondary);">
                                    <i class="bi bi-key-fill me-1 text-primary"></i>Demo Test Accounts
                                </span>
                                <span class="badge bg-light text-muted border" style="font-size: 0.68rem;">1-Click Fill</span>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-sm btn-light border text-start d-flex justify-content-between align-items-center py-2 px-3 shadow-none rounded-3"
                                        onclick="fillDemo('customer@stayease.com', 'Customer@1234')">
                                    <div>
                                        <div class="fw-semibold text-dark" style="font-size: 0.82rem;">
                                            <i class="bi bi-person-fill me-1 text-primary"></i>Demo Customer
                                        </div>
                                        <div class="text-muted font-monospace" style="font-size: 0.72rem;">customer@stayease.com &bull; Customer@1234</div>
                                    </div>
                                    <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-1" style="font-size: 0.7rem;">Auto-Fill</span>
                                </button>
                                <button type="button" class="btn btn-sm btn-light border text-start d-flex justify-content-between align-items-center py-2 px-3 shadow-none rounded-3"
                                        onclick="fillDemo('admin@stayease.com', 'Admin@1234')">
                                    <div>
                                        <div class="fw-semibold text-dark" style="font-size: 0.82rem;">
                                            <i class="bi bi-shield-lock-fill me-1 text-danger"></i>Demo Administrator
                                        </div>
                                        <div class="text-muted font-monospace" style="font-size: 0.72rem;">admin@stayease.com &bull; Admin@1234</div>
                                    </div>
                                    <span class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1" style="font-size: 0.7rem;">Auto-Fill</span>
                                </button>
                            </div>
                        </div>

                    </div><!-- /card-body -->
                </div><!-- /card -->

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

<script>
    function fillDemo(email, password) {
        var emailInput = document.getElementById('email');
        var passInput = document.getElementById('password');
        if (emailInput && passInput) {
            emailInput.value = email;
            passInput.value = password;
            emailInput.focus();
        }
    }
</script>

</body>
</html>
