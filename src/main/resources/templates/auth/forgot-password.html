<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('StayEase | Forgot Password')}"></head>

<body class="d-flex flex-column min-vh-100" style="background-color: var(--surface-page);">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container se-container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <!-- Reset Request Card -->
                <div class="card border-0 shadow-sm"
                     style="background: var(--surface-card); border-radius: 12px; border: 1px solid var(--border-default) !important;">

                    <div class="card-body p-4 p-sm-5">

                        <!-- Brand mark & heading -->
                        <div class="text-center mb-4">
                            <span class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                                  style="width: 48px; height: 48px; background-color: rgba(26, 43, 136, 0.1); color: var(--brand-cobalt);">
                                <i class="bi bi-key-fill fs-4"></i>
                            </span>
                            <h1 class="h3 fw-bold mb-1" style="color:var(--text-primary); font-family: var(--font-heading);">
                                Reset your password
                            </h1>
                            <p class="small text-secondary mb-0">
                                Enter your registered email address and we'll send you single-use reset instructions.
                            </p>
                        </div>

                        <!-- Form -->
                        <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="mb-4">
                                <label for="email" class="form-label fw-medium small" style="color:var(--text-primary);">
                                    Email address
                                </label>
                                <input type="email"
                                       id="email"
                                       th:field="*{email}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       placeholder="you@example.com"
                                       required
                                       autofocus
                                       autocomplete="email"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}">
                                    <span th:errors="*{email}"></span>
                                </div>
                            </div>

                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-cobalt btn-lg fw-semibold">
                                    <i class="bi bi-envelope-paper me-2"></i>Send Reset Link
                                </button>
                            </div>

                            <div class="text-center">
                                <a th:href="@{/login}" class="small text-decoration-none fw-medium" style="color:var(--brand-cobalt);">
                                    <i class="bi bi-arrow-left me-1"></i>Back to Sign in
                                </a>
                            </div>
                        </form>

                    </div><!-- /card-body -->
                </div><!-- /card -->

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
