<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Register')}"></head>

<body class="d-flex flex-column min-vh-100" style="background: var(--surface-page);">

<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container se-container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

                <!-- Card -->
                <div class="card border-0 shadow-sm" style="background: var(--surface-card);">
                    <div class="card-body p-4 p-md-5">

                        <!-- Header -->
                        <div class="text-center mb-4">
                            <span class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                                  style="width:52px;height:52px;background:var(--brand-cobalt-soft);">
                                <i class="bi bi-person-plus-fill fs-4" style="color:var(--brand-cobalt);"></i>
                            </span>
                            <h1 class="h4 fw-bold mb-1" style="color:var(--text-primary);">Create your account</h1>
                            <p class="small" style="color:var(--text-secondary);">
                                Already have an account?
                                <a th:href="@{/login}" style="color:var(--brand-cobalt);">Sign in</a>
                            </p>
                        </div>

                        <!-- Registration Form -->
                        <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>

                            <!-- CSRF token (Spring Security auto-injects for Spring MVC forms but we're explicit) -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-medium small"
                                       style="color:var(--text-primary);">Full name</label>
                                <input type="text"
                                       id="fullName"
                                       th:field="*{fullName}"
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                                       class="form-control"
                                       placeholder="Jane Smith"
                                       autocomplete="name"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}">
                                    <span th:errors="*{fullName}"></span>
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-medium small"
                                       style="color:var(--text-primary);">Email address</label>
                                <input type="email"
                                       id="email"
                                       th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       class="form-control"
                                       placeholder="you@example.com"
                                       autocomplete="email"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}">
                                    <span th:errors="*{email}"></span>
                                </div>
                            </div>

                            <!-- Phone (optional) -->
                            <div class="mb-3">
                                <label for="phone" class="form-label fw-medium small"
                                       style="color:var(--text-primary);">
                                    Phone number
                                    <span class="text-secondary fw-normal">(optional)</span>
                                </label>
                                <input type="tel"
                                       id="phone"
                                       th:field="*{phone}"
                                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                                       class="form-control"
                                       placeholder="10-digit mobile number"
                                       autocomplete="tel"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}">
                                    <span th:errors="*{phone}"></span>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-medium small"
                                       style="color:var(--text-primary);">Password</label>
                                <input type="password"
                                       id="password"
                                       th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                       class="form-control"
                                       placeholder="At least 8 characters"
                                       autocomplete="new-password"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}">
                                    <span th:errors="*{password}"></span>
                                </div>
                                <div class="form-text small mt-1" style="color:var(--text-subtle);">
                                    8–64 characters, must include at least one letter and one digit.
                                </div>
                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-medium small"
                                       style="color:var(--text-primary);">Confirm password</label>
                                <input type="password"
                                       id="confirmPassword"
                                       th:field="*{confirmPassword}"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                       class="form-control"
                                       placeholder="Repeat your password"
                                       autocomplete="new-password"/>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}">
                                    <span th:errors="*{confirmPassword}"></span>
                                </div>
                            </div>

                            <!-- Submit -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-cobalt btn-lg fw-semibold">
                                    <i class="bi bi-person-check me-2"></i>Create account
                                </button>
                            </div>

                        </form>

                        <!-- Divider & login link -->
                        <hr class="my-4" style="border-color:var(--border-default);">
                        <p class="text-center small mb-0" style="color:var(--text-secondary);">
                            Have an account already?
                            <a th:href="@{/login}" class="fw-medium" style="color:var(--brand-cobalt);">Sign in here</a>
                        </p>

                    </div><!-- /card-body -->
                </div><!-- /card -->

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
