# ==============================================================================
# StayEase — Production Application Configuration (Profile: prod)
# ==============================================================================
# Strict security, optimized connection pooling, sanitized errors, and metrics.
# Secrets MUST be supplied via environment variables or secret managers.
# ==============================================================================

# ── Server & Reverse Proxy ───────────────────────────────────────────────────
server.port=${PORT:8080}
# Trust X-Forwarded-* headers from Nginx or AWS ALB / Cloudflare
server.forward-headers-strategy=framework
# Graceful shutdown to complete in-flight transactions before terminating
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── Session & Cookie Security ────────────────────────────────────────────────
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=STAYEASE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# ── Production Safe Error Handling (No info leakage) ─────────────────────────
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ── Production DataSource & HikariCP Pool Tuning ─────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Optimization
spring.datasource.hikari.pool-name=StayEaseProdHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate (Validated schema, no auto-altering in prod) ──────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Thymeleaf Template Caching (Enabled for production performance) ──────────
spring.thymeleaf.cache=true

# ── Actuator Health, Liveness, and Readiness Probes ──────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.mail.enabled=false
management.info.env.enabled=false

# ── Privacy-Conscious Logging ────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.stayease=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO
