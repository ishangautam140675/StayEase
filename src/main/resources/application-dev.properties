# ==============================================================================
# StayEase — Development Application Configuration (Profile: dev)
# ==============================================================================

server.port=8080
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

spring.thymeleaf.cache=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# DataSource: Defaults to in-memory H2 if MySQL is not specified via DB_URL
spring.datasource.url=${DB_URL:jdbc:h2:mem:stayease;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
