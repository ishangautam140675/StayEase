# Main application properties
# Secrets are read from environment variables — never hardcoded here.

# ── DataSource ──────────────────────────────────────────────────────────────
# DB_URL defaults to local MySQL; override via environment variable in production.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stayease?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
# DB_PASSWORD has NO default — the app will fail fast if the env var is missing.
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# "update" creates/alters tables to match entities on startup.
# Use "validate" or "none" in production and rely on Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update

# Disable Open Session in View to avoid lazy-loading pitfalls outside transactions.
spring.jpa.open-in-view=false

# Show SQL in the console during development (remove or set false in production).
spring.jpa.show-sql=true

# ── Thymeleaf ───────────────────────────────────────────────────────────────
# Disable template caching so changes are picked up without restart during dev.
spring.thymeleaf.cache=false

# ── Session ─────────────────────────────────────────────────────────────────
# Session expires after 30 minutes of inactivity.
server.servlet.session.timeout=30m
# HttpOnly prevents JavaScript from reading the session cookie (XSS protection).
server.servlet.session.cookie.http-only=true

# ── Admin seed account (Phase 5 DataSeeder) ─────────────────────────────────
# Set these environment variables to auto-create a bootstrap ADMIN user on
# first startup. Leave blank to skip seeding (a warning will be logged).
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ── Booking & Cancellation Policy (Phase 3) ─────────────────────────────────
app.booking.cancellation-lead-hours=${BOOKING_CANCELLATION_LEAD_HOURS:24}

# ── Email and Notification Settings (Phase 4) ────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:noreply@stayease.com}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ── Payment Gateway & External Services (Phase 6) ───────────────────────────
app.payment.provider=${PAYMENT_PROVIDER:sandbox}
app.payment.currency=${PAYMENT_CURRENCY:INR}
app.payment.sandbox.key=${PAYMENT_SANDBOX_KEY:sb_test_key_stayease}
app.payment.sandbox.secret=${PAYMENT_SANDBOX_SECRET:sb_test_secret_stayease}
app.payment.sandbox.webhook-secret=${PAYMENT_SANDBOX_WEBHOOK_SECRET:sb_whsec_stayease_2026}

# External gateway (e.g. Razorpay) credentials from environment (empty by default)
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}



